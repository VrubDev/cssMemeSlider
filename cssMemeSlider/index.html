<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme slider</title>
  </head>
  <body>
    <input type="radio" name="slider" id="slide-1" checked />
    <input type="radio" name="slider" id="slide-2" />
    <input type="radio" name="slider" id="slide-3" />
    <input type="radio" name="slider" id="slide-4" />
    <div class="wrapper">
      <div>
        <img src="./assets/slide1.jpg" alt="Meme 1" />
        <img src="./assets/slide2.jpg" alt="Meme 2" />
        <img src="./assets/slide3.jpg" alt="Meme 3" />
        <img src="./assets/slide4.jpg" alt="Meme 4" />
      </div>
      <div class="bottom-bar">
        <div class="text-container">
          <p>I'm best of the best!</p>
          <p>I'm best of the best of the best!</p>
          <p>Keep going... I beliene in you!</p>
          <p>Don't stop!</p>
        </div>
        <div class="controls">
          <label for="slide-1" class="dot"></label>
          <label for="slide-2" class="dot"></label>
          <label for="slide-3" class="dot"></label>
          <label for="slide-4" class="dot"></label>
        </div>
      </div>
    </div>
  </body>
</html>
